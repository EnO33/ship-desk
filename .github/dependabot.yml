version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # TanStack Start and Router packages must move together, mixed versions break route types.
      tanstack:
        patterns:
          - "@tanstack/*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "@tanstack/*"
